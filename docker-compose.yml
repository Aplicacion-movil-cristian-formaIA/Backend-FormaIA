version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: formaia_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: formaia
    ports:
      - "33060:33060" # X Protocol (X DevAPI) que usa tu backend C++
      - "3307:3306"   # Protocolo clásico
    volumes:
      # Carga automáticamente el esquema la primera vez que se crea la BD
      - ./formaia_schema.sql:/docker-entrypoint-initdb.d/formaia_schema.sql
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: formaia_backend
    ports:
      - "8080:8080"
    volumes:
      - ./.env:/app/.env
    depends_on:
      - db
    environment:
      # Sobrescribimos el host para que el backend se conecte al contenedor 'db'
      - DB_HOST=db
      - DB_PORT=33060
      - DB_USER=root
      - DB_PASSWORD=root
    restart: unless-stopped
